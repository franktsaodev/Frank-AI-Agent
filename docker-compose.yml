services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: frank-ai-agent:1.0.1
    container_name: frank-ai-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_VERSION: "1.0.1"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request; urllib.request.urlopen( 'http://127.0.0.1:8000/health', timeout=2 )
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
