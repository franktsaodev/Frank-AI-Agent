services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: frank-ai-agent:1.4.0
    container_name: frank-ai-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      APP_VERSION: "1.4.0"

    volumes:
      - huggingface-cache:/home/app/.cache/huggingface

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""

    image: frank-ai-agent-frontend:1.4.0
    container_name: frank-ai-agent-frontend

    ports:
      - "5173:80"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -q -O /dev/null http://127.0.0.1/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  huggingface-cache:
