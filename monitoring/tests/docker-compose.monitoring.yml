services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.metrics

    image: frank-ai-agent-metrics-fixture:local

    environment:
      MONITORING_FIXTURE_ACTIVE_STREAM_STATE: "${MONITORING_FIXTURE_ACTIVE_STREAM_STATE:-active}"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  prometheus:
    image: frank-ai-agent-prometheus:3.15.0

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    ports:
      - "127.0.0.1:19090:9090"

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - /bin/promtool
        - check
        - ready
        - --url=http://127.0.0.1:9090
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  grafana:
    image: frank-ai-agent-grafana:13.2.3

    ports:
      - "127.0.0.1:13000:3000"

    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"

    depends_on:
      prometheus:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
