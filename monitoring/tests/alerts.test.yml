rule_files:
  - /etc/prometheus/alerts.yml

evaluation_interval: 15s

tests:
  - name: Healthy API and unrelated failed target do not trigger an alert
    interval: 15s
    input_series:
      - series: 'up{job="frank-ai-agent",instance="api:8000"}'
        values: "1x8"
      - series: 'up{job="another-service",instance="other:8000"}'
        values: "0x8"
    alert_rule_test:
      - eval_time: 2m
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []

  - name: A short scrape failure does not trigger a firing alert
    interval: 15s
    input_series:
      - series: 'up{job="frank-ai-agent",instance="api:8000"}'
        values: "0 0 0 1 1 1 1 1 1"
    alert_rule_test:
      - eval_time: 30s
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []

  - name: A sustained failure becomes pending then firing and resolves after recovery
    interval: 15s
    input_series:
      - series: 'up{job="frank-ai-agent",instance="api:8000"}'
        values: "0 0 0 0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 45s
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              instance: api:8000
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent API metrics scrape is failing."
              description: "Prometheus has been unable to scrape the API metrics endpoint for at least one minute."
      - eval_time: 1m15s
        alertname: FrankAIAgentAPIScrapeFailed
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="FrankAIAgentAPIScrapeFailed",alertstate="pending"}'
        eval_time: 45s
        exp_samples:
          - labels: 'ALERTS{alertname="FrankAIAgentAPIScrapeFailed",alertstate="pending",job="frank-ai-agent",instance="api:8000",severity="warning"}'
            value: 1
  - name: Old failures and increases in other outcomes or jobs do not trigger an alert
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="failed"}'
        values: "5x24"
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="completed"}'
        values: "0+1x24"
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="incomplete"}'
        values: "0+1x24"
      - series: 'frank_ai_agent_chat_streams_total{job="another-service",instance="other:8000",outcome="failed"}'
        values: "0+1x24"
    alert_rule_test:
      - eval_time: 2m
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []
      - eval_time: 6m
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []

  - name: A missing failed outcome series does not trigger an alert
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="completed"}'
        values: "0+1x8"
    alert_rule_test:
      - eval_time: 2m
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []

  - name: An observed failure triggers an alert and resolves after leaving the window
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="failed"}'
        values: "0x3 1x20"
    alert_rule_test:
      - eval_time: 45s
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []
      - eval_time: 1m15s
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              instance: api:8000
              outcome: failed
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream failures were observed."
              description: "Prometheus observed an increase in failed chat streams within the last five minutes."
      - eval_time: 6m
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []

  - name: A counter reset does not trigger an alert but a later failure does
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_streams_total{job="frank-ai-agent",instance="api:8000",outcome="failed"}'
        values: "5x2 0x1 1x4"
    alert_rule_test:
      - eval_time: 1m
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts: []
      - eval_time: 1m30s
        alertname: FrankAIAgentChatStreamFailures
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              instance: api:8000
              outcome: failed
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream failures were observed."
              description: "Prometheus observed an increase in failed chat streams within the last five minutes."

  - name: Sustained first-content latency becomes pending then firing
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="10.0"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0+1x40"

    alert_rule_test:
      - eval_time: 6m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream first content is slow."
              description: "The job-wide first-content P95 has exceeded 5 seconds for at least five minutes while the rolling five-minute observation increase is at least 10."

    promql_expr_test:
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending"}'
        eval_time: 6m
        exp_samples:
          - labels: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending",job="frank-ai-agent",severity="warning"}'
            value: 1

  - name: Normal first-content latency and a slow unrelated job do not alert
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="2.5"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="another-service",instance="other:8000",le="5.0"}'
        values: "0x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="another-service",instance="other:8000",le="10.0"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="another-service",instance="other:8000",le="+Inf"}'
        values: "0+1x40"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="another-service",instance="other:8000"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 10m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []

  - name: A short first-content slowdown clears pending without firing
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0x12 100+100x27"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="10.0"}'
        values: "0+1x12 112+100x27"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0+1x12 112+100x27"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0+1x12 112+100x27"
    alert_rule_test:
      - eval_time: 3m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 10m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending"}'
        eval_time: 3m
        exp_samples:
          - labels: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending",job="frank-ai-agent",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow"}'
        eval_time: 4m
        exp_samples: []

  - name: Slow first content with too few observations does not alert
    interval: 1m
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="10.0"}'
        values: "0+1x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0+1x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0+1x12"
    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow"}'
        eval_time: 8m
        exp_samples: []

  - name: Zero first-content observations do not alert
    interval: 1m
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="10.0"}'
        values: "0x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0x12"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []

  - name: Missing first-content metrics do not trigger the latency alert
    interval: 1m
    input_series:
      - series: 'up{job="frank-ai-agent",instance="api:8000"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []

  - name: A firing first-content latency alert resolves after recovery
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="5.0"}'
        values: "0x32 100+100x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="10.0"}'
        values: "0+1x32 132+100x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api:8000",le="+Inf"}'
        values: "0+1x32 132+100x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api:8000"}'
        values: "0+1x32 132+100x15"
    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream first content is slow."
              description: "The job-wide first-content P95 has exceeded 5 seconds for at least five minutes while the rolling five-minute observation increase is at least 10."
      - eval_time: 10m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []

  - name: Low-volume instances jointly satisfy the first-content observation threshold
    interval: 1m
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="5.0"}'
        values: "0x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="10.0"}'
        values: "0+1x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="+Inf"}'
        values: "0+1x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-a:8000"}'
        values: "0+1x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="5.0"}'
        values: "0x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="10.0"}'
        values: "0+1x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="+Inf"}'
        values: "0+1x15"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-b:8000"}'
        values: "0+1x15"

    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream first content is slow."
              description: "The job-wide first-content P95 has exceeded 5 seconds for at least five minutes while the rolling five-minute observation increase is at least 10."

    promql_expr_test:
      - expr: 'sum by (job, instance) (increase(frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent"}[5m]))'
        eval_time: 8m
        exp_samples:
          - labels: '{job="frank-ai-agent",instance="api-a:8000"}'
            value: 5
          - labels: '{job="frank-ai-agent",instance="api-b:8000"}'
            value: 5
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending"}'
        eval_time: 8m
        exp_samples:
          - labels: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending",job="frank-ai-agent",severity="warning"}'
            value: 1

  - name: High-volume normal traffic keeps the aggregated first-content P95 below the threshold
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-slow:8000",le="5.0"}'
        values: "0x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-slow:8000",le="10.0"}'
        values: "0+1x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-slow:8000",le="+Inf"}'
        values: "0+1x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-slow:8000"}'
        values: "0+1x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-fast:8000",le="5.0"}'
        values: "0+100x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-fast:8000",le="10.0"}'
        values: "0+100x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-fast:8000",le="+Inf"}'
        values: "0+100x48"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-fast:8000"}'
        values: "0+100x48"

    alert_rule_test:
      - eval_time: 8m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 12m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []

    promql_expr_test:
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow"}'
        eval_time: 8m
        exp_samples: []

  - name: One instance reset does not alert but later sustained slow content does
    interval: 15s
    input_series:
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="5.0"}'
        values: "0x60"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="10.0"}'
        values: "1000x11 0x12 1+1x35"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-a:8000",le="+Inf"}'
        values: "1000x11 0x12 1+1x35"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-a:8000"}'
        values: "1000x11 0x12 1+1x35"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="5.0"}'
        values: "1000x60"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="10.0"}'
        values: "1000x60"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent",instance="api-b:8000",le="+Inf"}'
        values: "1000x60"
      - series: 'frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent",instance="api-b:8000"}'
        values: "1000x60"

    alert_rule_test:
      - eval_time: 4m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 9m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts: []
      - eval_time: 15m
        alertname: FrankAIAgentChatStreamFirstContentSlow
        exp_alerts:
          - exp_labels:
              job: frank-ai-agent
              severity: warning
            exp_annotations:
              summary: "Frank AI Agent chat stream first content is slow."
              description: "The job-wide first-content P95 has exceeded 5 seconds for at least five minutes while the rolling five-minute observation increase is at least 10."

    promql_expr_test:
      - expr: 'sum by (job) (increase(frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent"}[5m]))'
        eval_time: 4m
        exp_samples:
          - labels: '{job="frank-ai-agent"}'
            value: 0
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow"}'
        eval_time: 4m
        exp_samples: []
      - expr: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending"}'
        eval_time: 9m
        exp_samples:
          - labels: 'ALERTS{alertname="FrankAIAgentChatStreamFirstContentSlow",alertstate="pending",job="frank-ai-agent",severity="warning"}'
            value: 1
