groups:
  - name: frank-ai-agent
    rules:
      - alert: FrankAIAgentAPIScrapeFailed
        expr: up{job="frank-ai-agent"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Frank AI Agent API metrics scrape is failing."
          description: "Prometheus has been unable to scrape the API metrics endpoint for at least one minute."
          runbook_url: "https://github.com/franktsaodev/Frank-AI-Agent/blob/master/docs/monitoring-runbook.md#api-metrics-scrape-failure"
      - alert: FrankAIAgentChatStreamFailures
        expr: increase(frank_ai_agent_chat_streams_total{job="frank-ai-agent",outcome="failed"}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Frank AI Agent chat stream failures were observed."
          description: "Prometheus observed an increase in failed chat streams within the last five minutes."
          runbook_url: "https://github.com/franktsaodev/Frank-AI-Agent/blob/master/docs/monitoring-runbook.md#chat-stream-failures"
      - alert: FrankAIAgentChatStreamFirstContentSlow
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (job, le) (
                rate(frank_ai_agent_chat_stream_first_content_duration_seconds_bucket{job="frank-ai-agent"}[5m])
              )
            ) > 5
          )
          and on (job)
          (
            sum by (job) (
              increase(frank_ai_agent_chat_stream_first_content_duration_seconds_count{job="frank-ai-agent"}[5m])
            ) >= 10
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frank AI Agent chat stream first content is slow."
          description: "The job-wide first-content P95 has exceeded 5 seconds for at least five minutes while the rolling five-minute observation increase is at least 10."
          runbook_url: "https://github.com/franktsaodev/Frank-AI-Agent/blob/master/docs/monitoring-runbook.md#slow-first-content"
